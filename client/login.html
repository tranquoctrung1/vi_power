<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ViPower — Đăng nhập</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="style/login.css" rel="stylesheet">
</head>
<body>

<div class="login-page">
  <div id="loginWrap" style="display:none">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon"><i class="bi bi-lightning-charge-fill"></i></div>
      <span class="logo-text">ViPower</span>
    </div>
    <div class="login-title">Đăng nhập hệ thống</div>
    <div class="login-subtitle">Giám sát năng lượng nhà máy xử lý nước</div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <div class="input-wrap">
          <i class="bi bi-person input-icon"></i>
          <input type="text" class="form-input" id="username"
            placeholder="username" autocomplete="username" autofocus/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <div class="input-wrap">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" class="form-input" id="password"
            placeholder="••••••••" autocomplete="current-password"/>
          <button type="button" class="btn-eye" id="btnTogglePass" tabindex="-1">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn-login" id="btnLogin">
        <i class="bi bi-arrow-repeat spin" id="btnSpinner" style="display:none"></i>
        <span id="btnLoginText">Đăng nhập</span>
      </button>
    </form>
  </div>
  <div class="login-footer">ViPower © 2025 — Hệ thống giám sát năng lượng</div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
